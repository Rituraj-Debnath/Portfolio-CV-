<style>
:root{
  --bg:#141a24;
  --bg-2:#1b2230;
  --line:#2a3344;
  --text:#d9dfe8;
  --muted:#8792a3;
  --amber:#f0b44c;
  --teal:#62c7b8;
  --rose:#e57b84;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f3f0e8; --bg-2:#e9e5da; --line:#cfc8b8; --text:#1f2530; --muted:#5d6676;
  --amber:#a8660a; --teal:#1f7f73; --rose:#b23a48;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.6;padding-bottom:3.5rem}
a{color:var(--teal);text-underline-offset:3px}
a:hover{color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px}
::selection{background:var(--amber);color:var(--bg)}

.wrap{max-width:1040px;margin:0 auto;padding:0 1.25rem}

/* ---------- hero shell ---------- */
.hero{padding:3.5rem 0 2rem}
.name{font-family:var(--mono);font-weight:800;font-size:clamp(2.2rem,7vw,4.6rem);line-height:1.02;letter-spacing:-.03em;margin:0}
.name .cursor{display:inline-block;width:.5em;height:.9em;background:var(--amber);vertical-align:-.05em;margin-left:.08em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.role{font-family:var(--mono);color:var(--muted);margin:.6rem 0 1.8rem;font-size:1rem}
.role b{color:var(--teal);font-weight:500}

.term{border:1px solid var(--line);background:var(--bg-2);border-radius:8px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:.5rem;padding:.55rem .9rem;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.dots{display:flex;gap:6px;margin-right:.4rem}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dots i:nth-child(1){background:var(--rose)}.dots i:nth-child(2){background:var(--amber)}.dots i:nth-child(3){background:var(--teal)}
.term-body{font-family:var(--mono);font-size:.9rem;line-height:1.6;padding:1rem 1.1rem;height:clamp(300px,46vh,440px);overflow-y:auto;cursor:text}
.term-body .out{white-space:pre-wrap;word-break:break-word}
.p{color:var(--amber)}.t{color:var(--teal)}.m{color:var(--muted)}.r{color:var(--rose)}
.input-line{display:flex;gap:.6ch}
.input-line input{flex:1;background:transparent;border:0;color:var(--text);font:inherit;padding:0;min-width:0;caret-color:var(--amber)}
.input-line input:focus{outline:none}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;padding:.7rem 1.1rem;border-top:1px solid var(--line)}
.chip{font-family:var(--mono);font-size:.78rem;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:.25rem .6rem;cursor:pointer}
.chip:hover{border-color:var(--amber);color:var(--amber)}

/* ---------- sections ---------- */
section{padding:3.5rem 0 1rem}
.cmd{font-family:var(--mono);font-size:1.35rem;font-weight:700;margin:0 0 1.4rem;letter-spacing:-.01em}
.cmd .p{font-weight:500}
.lede{max-width:68ch;margin:0;color:var(--text)}

/* shared pane (skills + career) */
.pane{border:1px solid var(--line);background:var(--bg-2);border-radius:8px;overflow:hidden}
.pane-tools{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;justify-content:space-between;padding:.7rem 1.1rem;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.grep{display:flex;align-items:center;gap:.7ch;color:var(--amber)}
.grep input{background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--text);font:inherit;padding:.3rem .55rem;width:17ch}
.grep input:focus{outline:none;border-color:var(--amber)}
.tool-btn{background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--muted);font:inherit;padding:.25rem .6rem;cursor:pointer}
.tool-btn:hover{color:var(--amber);border-color:var(--amber)}

/* skills as `tree` output */
.tree{font-family:var(--mono);font-size:.9rem;line-height:1.75;padding:1.1rem 1.3rem .4rem;columns:230px;column-gap:2.5rem}
.tree .root{column-span:all;color:var(--amber);font-weight:700;margin-bottom:.4rem}
.dir{break-inside:avoid;margin-bottom:1rem}
.dname{color:var(--teal);font-weight:700}
.dir ul{list-style:none;margin:0;padding:0}
.dir li{white-space:nowrap;transition:opacity .15s}
.br{color:var(--muted);opacity:.55}
.dir li.dim,.dir.dim .dname{opacity:.2}
.dir mark{background:var(--amber);color:var(--bg);border-radius:2px;padding:0 1px}
.tree-foot{font-family:var(--mono);font-size:.82rem;color:var(--muted);padding:0 1.3rem 1.1rem}

/* career as `git log --graph` */
.graph{padding:1.6rem 1.3rem .4rem}
.branch{--c:var(--amber);position:relative;padding-left:2.7rem;padding-bottom:1.8rem}
.branch::before{content:"";position:absolute;left:10px;top:14px;bottom:0;width:2px;background:var(--c)}
.branch.root{padding-bottom:.6rem}
.branch.root::before{display:none}
.ref{position:relative;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:.3rem 1.5rem;margin-bottom:1.1rem}
.ref::before{content:"";position:absolute;left:-2.7rem;top:1px;width:22px;height:22px;border-radius:50%;border:2px solid var(--c);background:radial-gradient(circle,var(--c) 0 4px,var(--bg-2) 5px)}
.branch.root .ref::before{background:var(--bg-2)}
.refs{font-family:var(--mono);font-size:.76rem;color:var(--c);display:block;margin-bottom:.1rem}
.ref h3{font-family:var(--mono);font-size:1.3rem;line-height:1.25;margin:0;letter-spacing:-.015em}
.ref .co{font-size:1rem;font-weight:500;margin-top:.1rem}
.ref .when{font-family:var(--mono);font-size:.82rem;color:var(--muted);text-align:right;line-height:1.5}
.ref .dur{color:var(--c);display:block}

details.cm{position:relative;border:1px solid var(--line);border-radius:6px;margin-bottom:.75rem;background:var(--bg)}
details.cm::before{content:"";position:absolute;left:calc(-2.7rem + 5px);top:1.05rem;width:12px;height:12px;border-radius:50%;background:var(--bg-2);border:2px solid var(--c)}
details.cm::after{content:"";position:absolute;left:calc(-2.7rem + 19px);right:100%;top:calc(1.05rem + 7px);border-top:1px dashed var(--c);opacity:.6}
details.cm[open]{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
details.cm summary{list-style:none;cursor:pointer;padding:.8rem 1rem;display:grid;grid-template-columns:1fr auto;gap:.35rem 1rem;align-items:start}
details.cm summary::-webkit-details-marker{display:none}
details.cm summary:focus-visible{outline-offset:-2px}
.cm .hash{font-family:var(--mono);font-size:.74rem;color:var(--c)}
.cm .msg{font-weight:600;line-height:1.4;margin-top:.1rem}
.cm .hl{display:inline-block;font-family:var(--mono);font-size:.74rem;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);border-radius:3px;padding:.05rem .45rem;margin-top:.45rem}
.cm .side{font-family:var(--mono);font-size:.78rem;color:var(--muted);text-align:right;white-space:nowrap}
.cm .caret{display:inline-block;margin-left:.5rem;transition:transform .15s;color:var(--c)}
.cm[open] .caret{transform:rotate(90deg)}
.cm-body{padding:.2rem 1rem 1rem;border-top:1px dashed var(--line)}
.cm-body ul{margin:.7rem 0 .8rem;padding-left:1.2rem;max-width:74ch}
.cm-body li{margin:.35rem 0;font-size:.96rem}
.cm-body li::marker{content:"+ ";color:var(--teal);font-family:var(--mono)}
.cm-body strong{color:var(--c);font-weight:600}
.graph-foot{font-family:var(--mono);font-size:.82rem;color:var(--muted);padding:0 1.3rem 1.1rem}
@media (max-width:600px){
  .graph{padding:1.3rem .9rem .3rem}
  .branch{padding-left:2.2rem}
  .ref::before{left:-2.2rem}
  details.cm::before{left:calc(-2.2rem + 5px)}
  details.cm::after{left:calc(-2.2rem + 19px)}
  details.cm summary{grid-template-columns:1fr}
  .cm .side{text-align:left}
  .ref .when{text-align:left}
}

/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.proj{text-align:left;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:1.1rem 1.2rem;color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:.5rem}
.proj:hover{border-color:var(--amber)}
.proj .file{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.proj h3{margin:0;font-size:1.05rem;font-weight:600;line-height:1.35}
.proj p{margin:0;font-size:.93rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:auto;padding-top:.4rem}
.tag{font-family:var(--mono);font-size:.72rem;color:var(--teal);border:1px solid var(--line);border-radius:3px;padding:.05rem .4rem}

/* certs */
.certs{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:.92rem}
.certs li{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;padding:.65rem 0;border-bottom:1px dashed var(--line);align-items:baseline}
.certs .ok{color:var(--teal)}
.certs .wip{color:var(--amber)}
.certs a{color:var(--text);text-decoration-color:var(--line)}.certs a:hover{color:var(--amber)}.certs .view{color:var(--teal);font-size:.78rem;text-decoration:none}
.certs .by{color:var(--muted);font-size:.8rem}

.contact{font-family:var(--mono);display:grid;gap:.5rem;font-size:.95rem}
.contact span.k{color:var(--muted);display:inline-block;min-width:10ch}
.btn{display:inline-block;font-family:var(--mono);font-size:.9rem;border:1px solid var(--amber);color:var(--amber);padding:.5rem 1rem;border-radius:4px;text-decoration:none;margin-top:1rem}
.btn:hover{background:var(--amber);color:var(--bg)}
footer{font-family:var(--mono);font-size:.78rem;color:var(--muted);padding:3rem 0 2rem}

/* tmux status bar */
.status{position:fixed;left:0;right:0;bottom:0;background:var(--amber);color:#1a1408;font-family:var(--mono);font-size:.8rem;display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;scrollbar-width:none}
.status .sess{background:#1a1408;color:var(--amber);padding:.45rem .8rem;font-weight:700;white-space:nowrap}
.status a{color:#1a1408;text-decoration:none;padding:.45rem .75rem;white-space:nowrap}
.status a.on{background:#1a1408;color:var(--amber)}
.status a:focus-visible{outline-color:#1a1408}
.status .theme{margin-left:auto;background:transparent;border:0;font:inherit;color:#1a1408;padding:.45rem .8rem;cursor:pointer;white-space:nowrap}

/* modal */
dialog{border:1px solid var(--line);background:var(--bg-2);color:var(--text);border-radius:8px;padding:0;width:min(720px,94vw);max-height:86vh}
dialog::backdrop{background:rgba(5,8,14,.7);backdrop-filter:blur(2px)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.modal-body{padding:1.3rem 1.5rem 1.6rem;overflow-y:auto;max-height:calc(86vh - 2.5rem)}
.modal-body .cat{font-family:var(--mono);font-size:.85rem;color:var(--muted);margin:0 0 .8rem}
.modal-body h2{font-family:var(--mono);font-size:1.3rem;margin:0 0 .3rem;line-height:1.3}
.modal-body .when{font-family:var(--mono);font-size:.82rem;color:var(--amber);margin-bottom:1rem}
.modal-body ul{padding-left:1.1rem}
.modal-body li{margin:.35rem 0}
.modal-body li::marker{content:"› ";color:var(--teal)}
.close{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:.75rem;border-radius:3px;padding:.1rem .5rem;cursor:pointer}
.close:hover{color:var(--rose);border-color:var(--rose)}

@media (max-width:600px){
  body{font-size:16px}
  .hero{padding-top:2rem}
  .term-body{font-size:.82rem}
  .certs li{grid-template-columns:auto 1fr}
  .certs .by{grid-column:2}
}
</style>
</head>

  <footer id="foot"></footer>
</main>

<nav class="status" id="status" aria-label="Sections"></nav>

<dialog id="modal" aria-labelledby="modal-title">

  <div class="modal-body" id="modal-body"></div>
</dialog>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P = PORTFOLIO;

function grepSkills(q) {
  q = q.trim().toLowerCase();
  let hits = 0;
  document.querySelectorAll("#skills-list .dir").forEach(dir => {
    let any = false;
    dir.querySelectorAll("li").forEach(li => {
      const nm = li.querySelector(".nm"), raw = nm.textContent;
      const at = q ? raw.toLowerCase().indexOf(q) : -1;
      const match = !q || at >= 0;
      li.classList.toggle("dim", !match);
      nm.innerHTML = at >= 0 ? esc(raw.slice(0, at)) + `<mark>${esc(raw.slice(at, at + q.length))}</mark>` + esc(raw.slice(at + q.length)) : esc(raw);
      if (q && match) { hits++; any = true; }
    });
    dir.classList.toggle("dim", !!q && !any);
  });
  $("#skill-hits").textContent = q ? (hits ? `${hits} match${hits > 1 ? "es" : ""}` : "no match — not in my stack yet") : "";
}
$("#skill-grep").addEventListener("input", e => grepSkills(e.target.value));

/* career graph */
const fakeHash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(7, "0").slice(0, 7); };
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function duration(period) {
  const [s, e] = period.split(/\s*[–-]\s*/);
  const parse = t => { const m = /([a-z]{3})\w*\s+(\d{4})/i.exec(t || ""); return m ? new Date(+m[2], MONTHS.indexOf(m[1].toLowerCase())) : null; };
  const a = parse(s), b = /present/i.test(e || "") ? new Date() : parse(e);
  if (!a || !b) return "";
  const n = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth() + 1;
  const y = Math.floor(n / 12), m = n % 12;
  return [y && `${y} yr${y > 1 ? "s" : ""}`, m && `${m} mo${m > 1 ? "s" : ""}`].filter(Boolean).join(" ");
}
const md = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const slug = t => t.toLowerCase().replace(/,.*$/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const RAILS = ["var(--amber)", "var(--teal)", "var(--rose)"];

$("#exp-list").innerHTML = P.experience.map((j, ji) => {

/* ---------- status bar (tmux-style nav) ---------- */

/* ---------- modal ---------- */
const modal = $("#modal");

/* ---------- interactive terminal ---------- */
const out = $("#term-out"), input = $("#term-in"), term = $("#term");
const print = html => { const d = document.createElement("div"); d.className = "out"; d.innerHTML = html; out.appendChild(d); term.scrollTop = term.scrollHeight; };
const echo = cmd => print(`<span class="p">${esc(P.handle)}@${P.host}:~$</span> ${esc(cmd)}`);

const COMMANDS = {
  help: () => [
    `<span class="t">available commands</span>`,
    ...[["whoami", "who I am"], ["about", "short summary"], ["skills", "tech stack"], ["grep &lt;term&gt;", "search my skills"], ["experience", "work history"],
        ["projects", "list projects"], ["open &lt;n&gt;", "open project n in a window"], ["certs", "certifications"],
        ["contact", "how to reach me"], ["cv", "download my CV"], ["goto &lt;section&gt;", "scroll to a section"],
        ["theme", "toggle light/dark"], ["clear", "clear the screen"]]
      .map(([c, d]) => `  <span class="p">${c.padEnd(16).replace(/ /g, "&nbsp;")}</span><span class="m">${d}</span>`),
    `<span class="m">tip: ↑/↓ for history, Tab to autocomplete</span>`].join("\n"),
  whoami: () => `${esc(P.name)}\n<span class="m">${esc(P.role)} · ${esc(P.location)}</span>`,
  about: () => esc(P.about),
  skills: () => P.skills.map(g => `<span class="t">${esc(g.group.padEnd(15))}</span>${esc(g.items.join(", "))}`).join("\n"),
  experience: () => P.experience.map(j => `<span class="p">${esc(j.period)}</span>  ${esc(j.title)} @ ${esc(j.company)}`).join("\n"),
  projects: () => P.projects.map((p, i) => `  <span class="p">[${i + 1}]</span> ${esc(p.title)}`).join("\n") + `\n<span class="m">type "open 1" to view details</span>`,
  certs: () => P.certifications.map(c => `${c.status === "done" ? '<span class="t">[✓]</span>' : '<span class="p">[…]</span>'} ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a>` : esc(c.name)}`).join("\n") + `\n<span class="m">click a certificate to view it</span>`,
  contact: () => contactRows.map(([k, v]) => `<span class="m">${k.padEnd(9)}</span>${v}`).join("\n"),
  cv: () => { if (!P.resumeUrl) return `<span class="r">no CV linked yet</span>`; const a = document.createElement("a"); a.href = P.resumeUrl; a.download = ""; a.click(); return `downloading ${esc(P.resumeUrl)}…`; },
  theme: () => { $("#theme-btn").click(); return `theme set to ${document.documentElement.dataset.theme}`; },
  clear: () => { out.innerHTML = ""; return null; },
  grep: args => {
    const q = (args[0] || "").toLowerCase();
    if (!q) return `<span class="r">usage: grep &lt;skill&gt;</span>`;
    const hits = P.skills.flatMap(g => g.items.filter(i => i.toLowerCase().includes(q)).map(i => `<span class="t">${esc(g.group)}/</span>${esc(i)}`));
    return hits.length ? hits.join("\n") : `<span class="m">no match for "${esc(q)}"</span>`;
  },
  sudo: () => `<span class="r">permission denied.</span> but you can still email me — try "contact".`,
  ls: () => sections.join("  "),
};
const ALIASES = { exp: "experience", work: "experience", certifications: "certs", "?": "help", cat: "about" };

function run(raw) {
  const line = raw.trim(); if (!line) return;
  echo(line);
  let [cmd, ...args] = line.split(/\s+/); cmd = (ALIASES[cmd.toLowerCase()] || cmd.toLowerCase());
  if (cmd === "open") {
    const n = parseInt(args[0], 10);
    if (openProject(n - 1)) print(`opened <span class="t">${esc(P.projects[n - 1].slug)}.md</span>`);
    else print(`<span class="r">usage: open &lt;1-${P.projects.length}&gt;</span>`);
    return;
  }
  if (cmd === "goto" || cmd === "cd") {
    const s = (args[0] || "").replace(/^~?\/?/, "");
    if (sections.includes(s)) { document.getElementById(s).scrollIntoView(); print(`→ ${esc(s)}`); }
    else print(`<span class="r">no such section.</span> try: ${sections.join(", ")}`);
    return;
  }
  const fn = COMMANDS[cmd];
  if (!fn) { print(`<span class="r">command not found: ${esc(cmd)}</span> — type <span class="p">help</span>`); return; }
  const r = fn(args); if (r) print(r);
}

const hist = []; let hi = 0;
input.addEventListener("keydown", e => {
  if (e.key === "Enter") { hist.push(input.value); hi = hist.length; run(input.value); input.value = ""; }
  else if (e.key === "ArrowUp") { if (hi > 0) input.value = hist[--hi]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { hi = Math.min(hist.length, hi + 1); input.value = hist[hi] || ""; e.preventDefault(); }
  else if (e.key === "Tab") {
    e.preventDefault();
    const all = [...Object.keys(COMMANDS), "open", "goto"];
    const m = all.filter(c => c.startsWith(input.value.toLowerCase()));
    if (m.length === 1) input.value = m[0] + " "; else if (m.length > 1) print(m.join("  "));
  }
});
term.addEventListener("click", () => { if (!window.getSelection().toString()) input.focus({ preventScroll: true }); });

["help", "whoami", "skills", "projects", "certs", "contact"].forEach(c => {
  const b = document.createElement("button"); b.className = "chip"; b.textContent = c;

});

/* one boot sequence on load: type "whoami" then show a hint */
(async function boot() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  print(`<span class="m">Last login: ${new Date().toDateString()} on ttys001</span>`);
  if (!reduce) {
    const line = document.createElement("div"); line.className = "out";
    line.innerHTML = `<span class="p">${esc(P.handle)}@${P.host}:~$</span> `; out.appendChild(line);
    for (const ch of "whoami") { await new Promise(r => setTimeout(r, 90)); line.innerHTML += ch; }
    await new Promise(r => setTimeout(r, 250));
    print(COMMANDS.whoami());
  } else { echo("whoami"); print(COMMANDS.whoami()); }
  print(`\nType <span class="p">help</span> to see what this terminal can do, or tap a command below.`);
})();
